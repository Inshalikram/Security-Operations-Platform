version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: sop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sop_admin
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: sop_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sop-network

  redis:
    image: redis:7-alpine
    container_name: sop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - sop-network

  minio:
    image: minio/minio:latest
    container_name: sop-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sop_admin
      MINIO_ROOT_PASSWORD: changeme123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - sop-network

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: sop-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/sop_db
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HOSTNAME: 169.58.221.49
      KC_HOSTNAME_PORT: 8080
      KC_HTTP_ENABLED: "true"
      KC_DB_USERNAME: sop_admin
      KC_DB_PASSWORD: changeme
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - sop-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    container_name: sop-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - sop-network

  cortex:
    image: thehiveproject/cortex:3.1.7-1
    container_name: sop-cortex
    restart: unless-stopped
    environment:
      - job_directory=/tmp/cortex-jobs
    ports:
      - "9002:9001"
    depends_on:
      - elasticsearch
    networks:
      - sop-network

  thehive:
    image: strangebee/thehive:5.4
    container_name: sop-thehive
    restart: unless-stopped
    ports:
      - "9003:9000"
    environment:
      JVM_OPTS: "-Xms1G -Xmx1G"
    networks:
      - sop-network

  misp:
    image: coolacid/misp-docker:core-latest
    container_name: sop-misp
    restart: unless-stopped
    environment:
      MYSQL_HOST: misp-db
      MYSQL_DATABASE: misp
      MYSQL_USER: misp
      MYSQL_PASSWORD: misp123
      MISP_ADMIN_EMAIL: admin@sop.local
      MISP_ADMIN_PASSPHRASE: admin123
      MISP_BASEURL: https://localhost:9004
      CRON_USER_ID: "1"
    ports:
      - "9004:443"
    depends_on:
      - misp-db
    networks:
      - sop-network

  misp-db:
    image: mysql:8.0
    container_name: sop-misp-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: misp
      MYSQL_USER: misp
      MYSQL_PASSWORD: misp123
    volumes:
      - misp_db_data:/var/lib/mysql
    networks:
      - sop-network

  wazuh-manager:
    image: wazuh/wazuh-manager:4.9.0
    container_name: sop-wazuh-manager
    restart: unless-stopped
    ports:
      - "1514:1514"
      - "1515:1515"
      - "55000:55000"
    environment:
      - INDEXER_URL=https://wazuh-indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword1
      - FILEBEAT_SSL_VERIFICATION_MODE=none
      - API_USERNAME=wazuh
      - API_PASSWORD=WazuhApi123!
    networks:
      - sop-network

  suricata:
    image: jasonish/suricata:latest
    container_name: sop-suricata
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    command: ["suricata", "-i", "eth0", "--pcap-file-continuous"]
    volumes:
      - suricata_logs:/var/log/suricata
      - ./suricata/rules:/var/lib/suricata/rules
    networks:
      - sop-network

  zeek:
    image: zeek/zeek:latest
    container_name: sop-zeek
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    entrypoint: ["/bin/sh", "-c", "cd /zeek-logs && zeek -i eth0 local"]
    volumes:
      - zeek_logs:/zeek-logs
    networks:
      - sop-network

  falco:
    image: falcosecurity/falco:latest
    container_name: sop-falco
    restart: unless-stopped
    privileged: true
    pid: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev:/host/dev
      - /proc:/host/proc:ro
      - /boot:/host/boot:ro
      - /lib/modules:/host/lib/modules:ro
      - /usr:/host/usr:ro
      - /etc:/host/etc:ro
    networks:
      - sop-network

  traefik:
    image: traefik:v3.3
    container_name: sop-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.le.acme.email=inshalikram06@gmail.com"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--accesslog=true"
      - "--log.level=DEBUG"
    ports:
      - "80:80"
      - "443:443"
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic
      - traefik_letsencrypt:/letsencrypt
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sop-backend
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://sop_admin:changeme@postgres:5432/sop_db
      - KEYCLOAK_URL=http://169.58.221.49:8080
      - KEYCLOAK_INTERNAL_URL=http://keycloak:8080
      - OLLAMA_URL=http://host.docker.internal:11434
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
      - WAZUH_API_URL=https://wazuh-manager:55000
      - WAZUH_API_USER=wazuh
      - WAZUH_API_PASSWORD=WazuhApi123!
    ports:
      - "8000:8000"
    volumes:
      - suricata_logs:/var/log/suricata:ro
      - zeek_logs:/var/log/zeek:ro
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - sop-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.169-58-221-49.nip.io`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=le"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      - "traefik.http.routers.backend.middlewares=rate-limit@file"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sop-frontend
    env_file:
      - ./frontend/.env.local
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - sop-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`app.169-58-221-49.nip.io`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=le"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"

  prometheus:
    image: prom/prometheus:latest
    container_name: sop-prometheus
    restart: unless-stopped
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - sop-network

  grafana:
    image: grafana/grafana:latest
    container_name: sop-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    ports:
      - "3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - sop-network

  n8n:
    image: n8nio/n8n:latest
    container_name: sop-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_SECURE_COOKIE=false
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=Asia/Karachi
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=changeme123
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - sop-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.169-58-221-49.nip.io`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls.certresolver=le"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: sop-cadvisor
    restart: unless-stopped
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - sop-network

  loki:
    image: grafana/loki:latest
    container_name: sop-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - sop-network

  promtail:
    image: grafana/promtail:latest
    container_name: sop-promtail
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./observability/promtail.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - sop-network
    depends_on:
      - loki

  tempo:
    image: grafana/tempo:latest
    container_name: sop-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    networks:
      - sop-network

volumes:
  postgres_data:
  minio_data:
  misp_db_data:
  suricata_logs:
  zeek_logs:
  n8n_data:
  grafana_data:
  traefik_letsencrypt:

networks:
  sop-network:
    driver: bridge
