# ==============================================================================
# Docker Compose Override for File-Based Docker Secrets
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
#
# Ensure secrets directory exists and has permissions 600:
#   mkdir -p ./secrets
#   chmod 700 ./secrets
# ==============================================================================

version: "3.8"

services:
  postgres:
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

  minio:
    environment:
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_password
    secrets:
      - minio_password

  keycloak:
    environment:
      KEYCLOAK_ADMIN_PASSWORD_FILE: /run/secrets/keycloak_admin_password
      KC_DB_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - keycloak_admin_password
      - postgres_password

  wazuh-manager:
    environment:
      - INDEXER_PASSWORD_FILE=/run/secrets/wazuh_indexer_password
      - API_PASSWORD_FILE=/run/secrets/wazuh_api_password
    secrets:
      - wazuh_indexer_password
      - wazuh_api_password

  grafana:
    environment:
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_password
    secrets:
      - grafana_password

  backend:
    secrets:
      - postgres_password
      - wazuh_indexer_password
      - wazuh_api_password

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  minio_password:
    file: ./secrets/minio_password.txt
  keycloak_admin_password:
    file: ./secrets/keycloak_admin_password.txt
  wazuh_indexer_password:
    file: ./secrets/wazuh_indexer_password.txt
  wazuh_api_password:
    file: ./secrets/wazuh_api_password.txt
  grafana_password:
    file: ./secrets/grafana_password.txt
